[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reportspec"
dynamic = ["version"]
description = "Portable Markdown report templates for evaluation evidence: validate, bundle and render to Markdown, JSON, HTML, PDF and DOCX"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/reportspec/fonts/LICENSE", "src/reportspec/fonts/OFL.txt", "src/reportspec/icons/LICENSE.txt"]
authors = [{ name = "William Caban" }]
keywords = ["evaluation", "reports", "ai-safety", "markdown", "pdf", "vega-lite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.23",
    "jinja2>=3.1.4",
    "jsonpath-rfc9535>=0.1.5",
    "markdown-it-py>=3",
    "altair>=6",
    "vl-convert-python>=1.9",
    "weasyprint>=68",
]

[project.urls]
Homepage = "https://github.com/williamcaban/reportspec"
Issues = "https://github.com/williamcaban/reportspec/issues"

[project.scripts]
reportspec = "reportspec.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
# Correctness and hygiene only; style churn is not worth a failing build. E501 is off: the code has long lines on purpose.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/reportspec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reportspec"]

[tool.hatch.build.targets.sdist]
include = ["src", "conformance", "examples", "README.md", "VISUAL-QA.md", "LICENSE", "NOTICE", "docs", "Containerfile", "pyproject.toml", "uv.lock", "tests"]
