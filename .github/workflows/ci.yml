name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}   # beats the repository's .python-version, so each matrix job really uses its own Python
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System packages (Pango for PDF, pandoc for DOCX, poppler for the font audit, fallback fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            pandoc poppler-utils fonts-liberation fonts-dejavu-core

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Lint
        run: uv run --frozen ruff check src tests

      - name: Unit tests (includes the PDF font audit)
        run: uv run --frozen pytest -ra

      - name: Conformance suite
        run: uv run --frozen reportspec conformance conformance

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Wheel installs with the service extra and `serve` starts
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/svc"
          uv pip install --python "$RUNNER_TEMP/svc/bin/python" "$(ls dist/*.whl)[service]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/svc/bin/reportspec" serve --port 8123 &
          pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8123/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8123/v1/capabilities
          kill $pid

      - name: Wheel works from a clean environment, outside the checkout
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/reportspec" --version
          "$RUNNER_TEMP/clean/bin/reportspec" render "$GITHUB_WORKSPACE/examples/model-release.report.md" \
            --input "$GITHUB_WORKSPACE/examples/inputs/model-release.jsonl" --format pdf -o "$RUNNER_TEMP/out.pdf"
          pdffonts "$RUNNER_TEMP/out.pdf" | tee "$RUNNER_TEMP/fonts.txt"
          if tail -n +3 "$RUNNER_TEMP/fonts.txt" | grep -v "Red-Hat-"; then echo "non Red Hat font in the PDF"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dist-py${{ matrix.python }}
          path: |
            dist/
            ${{ runner.temp }}/out.pdf
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["313", "314"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Fedora image
        run: docker build -f Containerfile --build-arg PY=${{ matrix.python }} -t reportspec:ci .

      - name: Conformance, offline, read-only, arbitrary uid (the OpenShift conditions)
        run: docker run --rm --network none --read-only --tmpfs /tmp --user 1234:0 reportspec:ci conformance conformance

      - name: PDF render in the same conditions, then audit its fonts
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network none --read-only --tmpfs /tmp --user 1234:0 -v "$PWD/out:/out" reportspec:ci \
            render examples/model-release.report.md --input examples/inputs/model-release.jsonl --format pdf -o /out/model-release.pdf
          pdffonts out/model-release.pdf | tee out/fonts.txt
          if tail -n +3 out/fonts.txt | grep -v "Red-Hat-"; then echo "non Red Hat font in the PDF"; exit 1; fi

      - name: The render service in the same conditions (HTTP in, PDF out), then audit the fonts
        run: |
          docker run -d --name svc -p 8000:8000 --read-only --tmpfs /tmp --user 1234:0 reportspec:ci serve --host 0.0.0.0
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/v1/capabilities
          python3 - <<'PY' > req.json
          import json
          print(json.dumps({"spec": open("examples/quickstart.report.md").read(),
                            "inputs": [{"content": open("examples/inputs/quickstart.jsonl").read(), "adapter": "jsonl"}],
                            "format": "pdf"}))
          PY
          curl -fs -X POST http://127.0.0.1:8000/v1/render -H 'content-type: application/json' --data @req.json -o out/service.pdf
          pdffonts out/service.pdf | tee out/service-fonts.txt
          if tail -n +3 out/service-fonts.txt | grep -v "Red-Hat-"; then echo "non Red Hat font in the PDF"; exit 1; fi
          docker logs svc
          docker rm -f svc
